version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request for all minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Node.js type definitions must match the Node version the project runs (22, see .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # These majors must move together with their plugins (eslint-plugin-jsx-a11y,
      # eslint-plugin-react, typescript-eslint). Upgrade them by hand once those support them.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
